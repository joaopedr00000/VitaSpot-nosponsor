name: Clean experimental builds

on:
  push:
    branches: [test/qr-device-login]
    paths:
      - '.github/workflows/cleanup-test-builds.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-experimental-builds
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'joaopedr00000/VitaSpot-nosponsor' && github.ref == 'refs/heads/test/qr-device-login'
    runs-on: ubuntu-24.04
    steps:
      - name: Retain recent builds and known good artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = 'test/qr-device-login';
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              { owner, repo, workflow_id: 'build-vpk.yml', branch, per_page: 100 }
            );
            const completed = runs.filter(r =>
              r.status === 'completed' &&
              r.head_branch === branch &&
              r.head_repository?.full_name === owner + '/' + repo &&
              ['push', 'pull_request', 'workflow_dispatch'].includes(r.event)
            ).sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
            const keep = new Set([
              45665342108, // validated translation VPK #63
              45671429974, // diagnostic VPK #72
              ...completed.slice(0, 5).map(r => r.id),
              ...completed.filter(r => r.conclusion === 'success').slice(0, 3).map(r => r.id)
            ]);
            let deleted = 0;
            for (const run of completed) {
              if (keep.has(run.id)) continue;
              await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
              deleted++;
              core.info('Deleted old experimental build #' + run.run_number);
            }
            await core.summary.addHeading('Experimental build cleanup')
              .addRaw('Deleted: ' + deleted + '; preserved completed: ' +
                completed.filter(r => keep.has(r.id)).length +
                '. Active runs, other branches and releases untouched.')
              .write();
