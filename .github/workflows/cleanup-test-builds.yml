name: Clean experimental builds

on:
  push:
    branches: [test/qr-device-login]
    paths:
      - '.github/workflows/cleanup-test-builds.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-experimental-builds
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'joaopedr00000/VitaSpot-nosponsor' && github.ref == 'refs/heads/test/qr-device-login'
    runs-on: ubuntu-24.04
    steps:
      - name: Remove obsolete experimental workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = 'test/qr-device-login';
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, branch, per_page: 100 }
            );
            const scoped = runs.filter(r =>
              r.head_branch === branch &&
              r.head_repository?.full_name === owner + '/' + repo &&
              ['push', 'pull_request', 'workflow_dispatch'].includes(r.event)
            ).sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at) || b.id - a.id);
            const builds = scoped.filter(r => r.path?.split('@')[0] === '.github/workflows/build-vpk.yml' || r.workflow_id === 430602110);
            const keep = new Set([context.runId]);
            if (builds[0]) keep.add(builds[0].id);
            // Keep a working VPK as a fallback only if the newest build is not successful.
            const latestGood = builds.find(r => r.status === 'completed' && r.conclusion === 'success');
            if (latestGood) keep.add(latestGood.id);
            let deleted = 0;
            let failed = 0;
            for (const run of scoped) {
              if (run.status !== 'completed' || keep.has(run.id)) continue;
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                deleted++;
                core.info('Deleted ' + run.name + ' #' + run.run_number + ' (' + run.id + ')');
              } catch (err) {
                if (err.status === 404) continue;
                failed++;
                core.warning('Could not delete run ' + run.id + ': ' + err.message);
              }
            }
            await core.summary.addHeading('Experimental workflow cleanup')
              .addRaw('Deleted: ' + deleted + '; failed: ' + failed + '; retained IDs: ' + [...keep].join(', ') +
                '. Active runs, other branches, tags and releases untouched.')
              .write();
            if (failed) core.setFailed('Some old workflow runs could not be deleted.');
